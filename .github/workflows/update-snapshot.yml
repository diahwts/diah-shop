name: Cập nhật snapshot sản phẩm

# Mục đích: tự động lấy danh sách sản phẩm/tồn kho mới nhất từ Apps Script rồi nhúng vào
# index.html, để khách vào web lần đầu thấy sản phẩm ngay lập tức (xem scripts/generate-snapshot.mjs).
#
# 3 cách để snapshot được cập nhật MÀ KHÔNG CẦN BẠN TỰ PUSH GIT:
#   1. "schedule": tự chạy định kỳ (mặc định mỗi 30 phút) — dùng cho trường hợp bạn quên bấm
#      chạy tay sau khi sửa sản phẩm.
#   2. "workflow_dispatch": bấm nút "Run workflow" trên tab Actions của GitHub NGAY SAU KHI vừa
#      thêm/sửa sản phẩm trong Sheet, để cập nhật ngay không cần đợi tới lượt chạy định kỳ tiếp theo.
#   3. "repository_dispatch" (tuỳ chọn nâng cao — xem HUONG-DAN-DEPLOY.txt nếu muốn Apps Script tự
#      gọi thẳng GitHub mỗi khi bạn sửa Sheet, không cần vào tay tab Actions).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [update-products-snapshot]

permissions:
  contents: write

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lấy dữ liệu sản phẩm mới nhất và nhúng vào index.html
        run: node scripts/generate-snapshot.mjs

      - name: Commit và push nếu có thay đổi
        run: |
          if git diff --quiet -- index.html; then
            echo "Không có gì thay đổi — bỏ qua commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: tự động cập nhật snapshot sản phẩm [skip ci]"
          git push
