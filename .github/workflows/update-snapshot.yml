name: Cập nhật snapshot sản phẩm

# Mục đích: lấy danh sách sản phẩm/tồn kho mới nhất từ Apps Script rồi nhúng vào index.html,
# để khách vào web lần đầu thấy sản phẩm ngay lập tức (xem scripts/generate-snapshot.mjs).
#
# Tự động chạy mỗi 2 tiếng (đủ để đỡ quên, nhưng không gọi API dư thừa như lịch 30 phút cũ).
# Muốn cập nhật ngay không cần đợi: vào tab Actions trên GitHub → chọn workflow
# "Cập nhật snapshot sản phẩm" → bấm nút "Run workflow".
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lấy dữ liệu sản phẩm mới nhất và nhúng vào index.html
        run: node scripts/generate-snapshot.mjs

      - name: Commit và push nếu có thay đổi
        run: |
          if git diff --quiet -- index.html; then
            echo "Không có gì thay đổi — bỏ qua commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: tự động cập nhật snapshot sản phẩm [skip ci]"
          git push
